            <h2>Add a Blog Entry</h2>

            <form action="#">

                <input type="text" id="title" name="title" placeholder="Write a title" required>

                <label for="content">Content</label>
                <textarea id="content" name="content" rows="10" placeholder="Write your blog entry here" required></textarea>
